<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 64" width="340" height="64">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#6366F1"/>
      <stop offset="100%" style="stop-color:#4338CA"/>
    </linearGradient>
  </defs>
  <!-- Icon (52x52, centered at y=32 -> top at 6) -->
  <g transform="translate(10, 6)">
    <rect width="52" height="52" rx="10" fill="url(#bg)"/>
    <!-- Orange dot: center at (26, 15.5) -->
    <circle cx="26" cy="15.5" r="5.5" fill="#FF765E"/>
    <circle cx="25" cy="14.5" r="2" fill="#FFB37C" opacity="0.7"/>
    <!-- Lower curve: center at y=32.5 -->
    <path d="M 10 27 Q 26 42 42 27" stroke="#FFFFFF" stroke-width="3.5" fill="none" stroke-linecap="round"/>
    <!-- Upper curve: center at y=25.5 -->
    <path d="M 15 21 Q 26 31 37 21" stroke="#FFFFFF" stroke-width="3" fill="none" stroke-linecap="round"/>
  </g>
  <!-- Text: centered with icon at y=32 -->
  <text x="74" y="32" dominant-baseline="central" font-family="Inter, system-ui, sans-serif" font-size="36" font-weight="600" fill="#312E81">Youchao</text>
</svg>
