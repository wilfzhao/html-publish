apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: html-publish-data
  namespace: html-prototype-publish
spec:
  storageClassName: ihm-nfs-storage
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 10Gi
---
apiVersion: v1
kind: Secret
metadata:
  name: html-publish-secret
  namespace: html-prototype-publish
type: Opaque
stringData:
  NEXTAUTH_SECRET: 20176d5e2b60623d310633b3993369c2d7255874ecd1e7cb667606176f0846fe
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: html-publish
  namespace: html-prototype-publish
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: html-publish
  template:
    metadata:
      labels:
        app: html-publish
    spec:
      securityContext:
        fsGroup: 1000
      containers:
        - name: html-publish
          image: harbor.dgmed.cn/sjwj/html-publish:v0.2.0
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8088
          env:
            - name: DATABASE_URL
              value: file:/data/app.db
            - name: UPLOAD_DIR
              value: /data/uploads
            - name: COVER_DIR
              value: /data/covers
            - name: HTML_PUBLISH_PUBLIC_URL
              value: http://192.168.10.123:30813
            - name: NEXTAUTH_SECRET
              valueFrom:
                secretKeyRef:
                  name: html-publish-secret
                  key: NEXTAUTH_SECRET
          volumeMounts:
            - name: data
              mountPath: /data
          readinessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "2"
              memory: 2Gi
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: html-publish-data
---
apiVersion: v1
kind: Service
metadata:
  name: html-publish
  namespace: html-prototype-publish
spec:
  type: NodePort
  selector:
    app: html-publish
  ports:
    - name: http
      port: 80
      targetPort: http
      nodePort: 30813
